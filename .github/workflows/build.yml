name: Build OpenWrt TL-WR941HP v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target TL-WR941HP v2 with LuCI
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_tl-wr941hp-v2=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          EOF
          make defconfig

      - name: Compile firmware
        run: |
          make -j2 || make package/feeds/luci/rpcd-mod-luci/compile V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openwrt-tl-wr941hp-v2-firmware
          path: bin/targets/ath79/generic/*tl-wr941hp-v2*
