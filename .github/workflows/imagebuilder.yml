name: Build TL-WR941HP v2 ImageBuilder

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version (e.g. 23.05.5 or 24.10.0)"
        required: true
        default: "23.05.5"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 zstd

      - name: Download and extract ImageBuilder
        run: |
          VER="${{ inputs.openwrt_version }}"
          URL="https://downloads.openwrt.org/releases/${VER}/targets/ath79/generic/openwrt-imagebuilder-${VER}-ath79-generic.Linux-x86_64.tar.xz"
          wget -q "$URL" -O ib.tar.xz
          tar -xf ib.tar.xz
          mv openwrt-imagebuilder-* ib

      - name: Detect profile and build firmware with LuCI
        run: |
          cd ib
          make info | grep -i "941hp" || true
          PROFILE=$(make info | grep -iE "wr941hp.*v2|941hp-v2" | head -n1 | awk '{print $1}')
          echo "Detected profile: $PROFILE"
          make image PROFILE="$PROFILE" PACKAGES="luci"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tl-wr941hp-v2-imagebuilder
          path: ib/bin/targets/ath79/generic/*941hp*
